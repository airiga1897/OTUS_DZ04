- name: Общая подготовка
  hosts: all
  become: true
  vars_files: [../.local/secrets.yml]
  pre_tasks:
    - name: Проверить готовность адаптера облака перед изменением серверов
      ansible.builtin.assert:
        that: (cloud_provider | default('yandex')) in ['yandex', 'selectel']
        fail_msg: "Поддерживаются только yandex и selectel."
  roles: [common]

- name: PostgreSQL и арбитр кворума
  hosts: database
  become: true
  vars_files: [../.local/secrets.yml]
  roles: [database]

- name: Пакеты и конфигурации экспериментального хранилища
  hosts: backend
  become: true
  vars_files: [../.local/secrets.yml]
  roles: [storage]

- name: Подготовка приложения без запуска до готовности GFS2
  hosts: backend
  become: true
  vars_files: [../.local/secrets.yml]
  roles: [application]

- name: Два фронта Nginx
  hosts: front
  become: true
  roles: [frontend]

